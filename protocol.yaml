command:
  - help
  - login
  - logout
  - users
  - user
  - send
  - messages
  - subscribe
  - unsubscribe
  - use
  - create
  - list
  - info

messageSuccess:
  - "000 Service ready.":
      - "connecting to the server data socket and port with the client"
  - "001 $(help)":
      - "/help"
  - "002 $(username) logged in, proceed.":
      - "/login $(username)"
  - "003 $(username) logged out.":
      - "/logout"
  - "004 $(all users on the domain)":
      - "/users"
  - "005 $(name of the user)":
      - "/user $(user_uuid)"
  - "006 Message sent.":
      - "/send $(user_uuid) $(message_body)"
  - "007 $(messages)":
      - "/messages $(user_uuid)"
  - "008 You've subscribed to the teams $(teams_name) $(teams_uuid)":
      - "/subscribe $(teams_uuid)"
  - "009 $(all_user's_subscribed_teams)":
      - "/subscribed"
  - ? "010 Users subscribed to the teams $(teams_uuid) $(all_users_subscribed_to_a_teams)"
    : - "/subscribed $(teams_uuid)"
  - "011 Unsubscribed from the teams $(teams_name) $(teams_uuid)":
      - "/unsubscribe $(teams_uuid)"
  - "012 Entered the teams $(teams_name)":
      - "/use $(teams_uuid)"
  - "013 Entered the channel $(channel_name) in the teams $(teams_name)":
      - "/use $(teams_uuid) $(channel_uuid)"
  - "014 Entered the thread $(thread_name) in the teams $(thread_uuid)":
      - "/use $(teams_uuid) $(channel_uuid) $(thread_uuid)"
  - "015 Back at the root":
      - "/use"
  - "016 $(created_according_to_the_context)":
      - root
      - teams
      - channel
      - thread
  - "020 $(list_according_to_the_context)":
      - root
      - teams
      - channel
      - thread
  - "024 $(info_according_to_the_context)":
      - root
      - teams
      - channel
      - thread

messageFailure:
  - 100: Invalid command. (command doesn't exist or should not be called in the current state)
  - 101: Bad sequence of commands. (command exists and can be called but the arguments are invalid)

  - 2: Data connection already open; transfer starting.
  - 3: File status okay; about to open data connection.
  - 5: Help message.
  - 6: Service closing control connection.
  - 10: Requested file action okay, completed.
  - 11: PATHNAME created.
  - 12: User name okay, need password.
  - 13: Need account for login.
